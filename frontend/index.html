<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHT Asset Generator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>SHT Asset Generator</h1>
            <div id="status-bar">
                <span id="api-status">Checking API...</span>
            </div>
        </header>

        <nav id="main-nav">
            <button data-tab="sounds" class="active">Sounds</button>
            <button data-tab="portraits" disabled>Portraits (Coming Soon)</button>
            <button data-tab="sprites" disabled>Sprites (Coming Soon)</button>
        </nav>

        <main id="content">
            <!-- Sounds Panel -->
            <section id="sounds-panel" class="tab-panel active">
                <div class="panel-grid">
                    <!-- Generate Section -->
                    <div class="panel-section">
                        <h2>Generate Sound Effect</h2>
                        <form id="sound-form">
                            <div class="form-group">
                                <label for="prompt">Sound Description</label>
                                <textarea id="prompt" name="prompt" rows="3"
                                    placeholder="Describe the sound effect you need...&#10;e.g., 'Heavy machine gun firing, distant, urban environment'"></textarea>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="duration">Duration (seconds)</label>
                                    <input type="number" id="duration" name="duration"
                                        value="2.0" min="0.5" max="22" step="0.5">
                                </div>

                                <div class="form-group">
                                    <label for="category">Category</label>
                                    <select id="category" name="category">
                                        <option value="combat">Combat</option>
                                        <option value="ui">UI</option>
                                        <option value="character">Character</option>
                                        <option value="environment">Environment</option>
                                        <option value="ambient">Ambient</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="tags">Tags (comma separated)</label>
                                <input type="text" id="tags" name="tags"
                                    placeholder="explosion, debris, close">
                            </div>

                            <button type="submit" class="btn-primary" id="generate-btn">
                                Generate Sound
                            </button>
                        </form>
                    </div>

                    <!-- Pending Approval Section -->
                    <div class="panel-section">
                        <h2>Pending Approval <span id="pending-count">(0)</span></h2>
                        <button id="refresh-pending" class="btn-secondary">Refresh</button>
                        <div id="pending-list"></div>
                    </div>
                </div>
            </section>

            <!-- Portraits Panel (placeholder) -->
            <section id="portraits-panel" class="tab-panel">
                <p>Portrait generation coming soon...</p>
            </section>

            <!-- Sprites Panel (placeholder) -->
            <section id="sprites-panel" class="tab-panel">
                <p>Sprite extraction coming soon...</p>
            </section>
        </main>

        <!-- Approval Modal -->
        <div id="approval-modal" class="modal hidden">
            <div class="modal-content">
                <h3>Approve Sound</h3>
                <div id="modal-sound-info"></div>

                <audio id="modal-audio" controls></audio>

                <form id="approval-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="volume-adjust">Volume Adjustment (dB)</label>
                            <input type="number" id="volume-adjust" value="0" min="-20" max="20" step="1">
                        </div>
                        <div class="form-group">
                            <label for="custom-name">Custom Name (optional)</label>
                            <input type="text" id="custom-name" placeholder="Leave blank for auto">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="trim-start">Trim Start (sec)</label>
                            <input type="number" id="trim-start" value="0" min="0" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="trim-end">Trim End (sec)</label>
                            <input type="number" id="trim-end" value="0" min="0" step="0.1">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fade-in">Fade In (sec)</label>
                            <input type="number" id="fade-in" value="0" min="0" max="2" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="fade-out">Fade Out (sec)</label>
                            <input type="number" id="fade-out" value="0" min="0" max="2" step="0.1">
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn-danger" id="reject-btn">Reject</button>
                        <button type="button" class="btn-secondary" id="regenerate-btn">Regenerate</button>
                        <button type="submit" class="btn-primary">Approve</button>
                        <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
